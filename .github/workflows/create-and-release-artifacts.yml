name: release-artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare frontend
        run: |
          cd frontend
          pnpm ci

      - name: Test frontend
        run: |
          cd frontend
          pnpm run typescript-check

      - name: Build frontend
        run: |
          cd frontend
          pnpm run build 

      - name: Setup backend
        run: |
          cd backend
          mkdir -p public
          cp -r ../frontend/dist/* public/
          pnpm ci

      - name: Generate Riot API types
        run: |
          cd backend
          pnpm run generate

      - name: Run backend tests
        run: |
          cd backend
          pnpm run test

      - name: Build  backend
        run: |
          cd backend
          pnpm run build

      - name: Upload backend bundle
        uses: actions/upload-artifact@v7
        with:
          name: backend-bundle
          path: |
            backend/dist
            backend/package.json
            backend/pnpm-workspace.yaml
            backend/pnpm-lock.yaml

      - name: Upload Changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: |
            CHANGELOG.md
  

  package-windows:
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend-bundle
          path: backend

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml

      - run: |
          cd backend
          pnpm ci
          pnpm run package

      - uses: actions/upload-artifact@v7
        with:
          name: windows-binary
          path: backend/binaries

  release:
    runs-on: ubuntu-latest
    needs: [ package-windows, build ]

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-binary
          path: windows

      - uses: actions/download-artifact@v8
        with:
          name: changelog
          path: changelog

      - name: Prepare release assets
        run: |
          mkdir release
          cp windows/*.exe release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body_path: ${{ github.workspace }}/changelog/CHANGELOG.md
          files: release/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}