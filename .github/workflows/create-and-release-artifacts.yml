name: release-artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.2.3)"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::Invalid version '$VERSION'"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists"; exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: frontend
        run: pnpm run typescript-check

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Install backend deps
        working-directory: backend
        run: |
          mkdir -p public
          cp -r ../frontend/dist/. public/
          pnpm install --frozen-lockfile

      - name: Generate Riot API types
        working-directory: backend
        run: pnpm run generate

      - name: Run backend tests
        working-directory: backend
        run: pnpm run test

      - name: Build backend
        working-directory: backend
        run: pnpm run build

      - uses: actions/upload-artifact@v7
        with:
          name: backend-bundle
          if-no-files-found: error
          path: |
            backend/dist
            backend/scripts
            backend/package.json
            backend/pnpm-workspace.yaml
            backend/pnpm-lock.yaml

      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          if-no-files-found: error
          path: CHANGELOG.md

  package-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend-bundle
          path: backend

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run package

      - uses: actions/upload-artifact@v7
        with:
          name: windows-binary
          if-no-files-found: error
          path: backend/binaries

  release:
    needs: [build, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-binary
          path: windows

      - uses: actions/download-artifact@v8
        with:
          name: changelog
          path: changelog

      - name: Prepare release assets
        run: |
            mkdir release
            cp windows/*.exe release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: changelog/CHANGELOG.md
          files: release/*
          fail_on_unmatched_files: true